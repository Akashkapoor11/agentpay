services:
  - type: web
    name: agentpay-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_NAME
        value: AgentPay
      - key: NEXT_PUBLIC_CURRENCY
        value: USD

  - type: web
    name: agentpay-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_MCP_ENABLED
        value: 'false'
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-astra
      - key: OPENAI_ANALYTICS_MODEL
        value: gpt-6-astra
      - key: DATABASE_URL
        fromDatabase:
          name: agentpay-db
          property: connectionString
      - key: DATABASE_SSL
        value: 'true'
      - key: DATABASE_POOL_MAX
        value: '5'
      - key: MANDATE_PRIVATE_KEY_B64
        sync: false
      - key: MANDATE_PUBLIC_KEY_B64
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: CHANNEL3_USER_ID
        value: agentpay-hackathon
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_TASK_SLUG
        value: agentpay-workflow/reconcile-payment
      - key: AGENTPAY_PUBLIC_URL
        sync: false
      - key: WORKFLOW_SHARED_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APIMATIC_CONTEXT_USED
        value: 'false'

  - type: workflow
    name: agentpay-workflow
    runtime: node
    rootDir: backend/workflows
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: WORKFLOW_SHARED_SECRET
        sync: false

databases:
  - name: agentpay-db
    plan: 0.1c-256mb
    databaseName: agentpay
    user: agentpay
